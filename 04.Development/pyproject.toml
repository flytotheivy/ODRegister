[project]
name = "serbia-layer1"
version = "0.1.0"
description = "Annual Open Data Plan Registry"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi==0.162.2", "uvicorn==0.54.0", "sqlalchemy==2.1.8", "alembic==1.20.1", "psycopg[binary]==3.3.8", "pydantic-settings==2.16.2"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "ruff==0.17.4",
    "jsonschema==4.25.0",
    "rfc3339-validator==0.1.4",
    "rfc3986-validator==0.1.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.scripts]
build = "python build.py"

[tool.vercel.fastapi.static]
cdn = false
exclude = false
